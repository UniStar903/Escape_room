<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room Gallery</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #111;
        }

        .gallery {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 1200px;
            margin: auto;
        }

        .gallery img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="gallery" id="gallery"></div>

    <script>
        const gallery = document.getElementById("gallery");

        for (let i = 1; i <= 18; i++) {
            const img = document.createElement("img");
            img.src = `crop_escape_room_${i}.png`;
            img.alt = `Escape Room ${i}`;
            loading = "lazy";
            gallery.appendChild(img);
        }
    </script>

</body>
</html>
